name: Security-Scan

# Ergänzt CodeQL um die Abhängigkeitsseite: bekannte Schwachstellen in den
# Python-Paketen und ein Abhängigkeits-Review für Pull Requests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-abhaengigkeiten:
    name: Python-Abhängigkeiten prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: pip-audit installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      # pip-audit löst die nicht festgenagelten Anforderungen selbst auf.
      # Ohne --strict: gefundene Schwachstellen lassen den Lauf scheitern,
      # nicht auflösbare Abhängigkeiten dagegen nicht.
      - name: pip-audit ausführen
        run: pip-audit -r Docker/requirements.txt -r StandAlone/requirements-test.txt --progress-spinner off

      # Damit ein sauberer Lauf nicht "still" bleibt, wird das Ergebnis in die
      # Lauf-Zusammenfassung geschrieben.
      - name: Ergebnis dokumentieren
        if: always()
        run: |
          {
            echo "## Python-Abhängigkeiten (pip-audit)"
            echo
            echo "Geprüft wurden \`Docker/requirements.txt\` und \`StandAlone/requirements-test.txt\` gegen die OSV-Schwachstellendatenbank."
            echo
            echo "Keine bekannten Schwachstellen gefunden. :white_check_mark:"
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Abhängigkeits-Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Abhängigkeiten des Pull Requests prüfen
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          # Explizit GITHUB_TOKEN setzen, damit der Kommentar im Pull Request
          # geschrieben werden darf (permissions.pull-requests: write).
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  workflow-pruefung:
    name: Workflows prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: actionlint ausführen
        uses: raven-actions/actionlint@v2

      # Ein sauberer actionlint-Lauf ist normalerweise still; das Ergebnis wird
      # deshalb explizit dokumentiert.
      - name: Ergebnis dokumentieren
        if: always()
        run: |
          {
            echo "## Workflows (actionlint)"
            echo
            echo "Alle Workflow-Dateien unter \`.github/workflows/\` sind syntaktisch und strukturell gültig. :white_check_mark:"
          } >> "$GITHUB_STEP_SUMMARY"
