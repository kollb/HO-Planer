name: CodeQL

# SAST für Python, für die Workflows selbst (Sprache "actions") und für das
# JavaScript der beiden Oberflächen. Für ein öffentliches Repository ist Code
# Scanning kostenlos.
#
# Aufteilung:
# - Python und Actions laufen nur, wenn die Repository-Variable
#   CODEQL_ADVANCED auf "true" steht UND das Standard-Setup deaktiviert ist.
#   Solange das Standard-Setup aktiv ist, deckt es Python und Actions bereits
#   ab - beides gleichzeitig geht nicht.
# - Das Inline-JavaScript der Oberflächen läuft IMMER. Solange das
#   Standard-Setup aktiv ist, kann GitHub die SARIF einer Advanced-Konfiguration
#   nicht übernehmen; die Ergebnisse werden dann als Workflow-Artefakt, als
#   Lauf-Zusammenfassung und als Annotationen sichtbar gemacht
#   (siehe .github/scripts/sarif-summary.py). Erst nach Umstellung auf
#   Advanced (CODEQL_ADVANCED=true) werden sie nach "Security → Code scanning"
#   hochgeladen.
#
# Umstellung auf Advanced (einmalig, Admin):
#   1. Settings → Code security and analysis → Code scanning → "Advanced"
#      (damit wird das Standard-Setup abgeschaltet).
#   2. Settings → Secrets and variables → Actions → Variables:
#      CODEQL_ADVANCED = true.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    name: Status der Security-Scans
    runs-on: ubuntu-latest
    outputs:
      advanced_upload_enabled: ${{ steps.state.outputs.advanced_upload_enabled }}
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      # Dieser Schritt läuft immer und macht sichtbar, was gescannt wird und
      # was (noch) nicht - damit ein "übersprungen" nie wieder still bleibt.
      - name: Zustand ermitteln und dokumentieren
        id: state
        shell: bash
        env:
          CODEQL_ADVANCED: ${{ vars.CODEQL_ADVANCED }}
        run: |
          advanced="${CODEQL_ADVANCED:-}"
          setup_status="unbekannt"
          if state="$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/default-setup" --jq '.state' 2>/dev/null)"; then
            setup_status="$state"
          fi

          advanced_upload_enabled="false"
          if [[ "$advanced" == "true" && "$setup_status" == "not-configured" ]]; then
            advanced_upload_enabled="true"
          fi

          {
            echo "## Security-Scans – Zustand"
            echo
            echo "| Baustein | Status |"
            echo "| --- | --- |"
            if [[ "$advanced" == "true" ]]; then
              if [[ "$advanced_upload_enabled" == "true" ]]; then
                echo "| CodeQL Advanced (Python, Actions, Inline-JS) | :white_check_mark: aktiv, Upload nach Code Scanning |"
              else
                echo "| CodeQL Advanced (Python, Actions, Inline-JS) | :ballot_box_with_check: Inline-JS im Artefakt-Modus, Python/Actions übersprungen (Standard-Setup noch aktiv) |"
              fi
              if [[ "$setup_status" == "configured" ]]; then
                echo "| Standard-Setup | :warning: noch aktiv - Upload schlägt fehl, bis auf Advanced umgestellt wird |"
              else
                echo "| Standard-Setup | deaktiviert |"
              fi
            else
              echo "| CodeQL Advanced (Python, Actions) | :ballot_box_with_check: übersprungen (Variable \`CODEQL_ADVANCED\` nicht \`true\`) |"
              echo "| CodeQL Standard-Setup | läuft unabhängig von diesem Workflow (Python + Actions) |"
            fi
            echo "| CodeQL Inline-JavaScript | :white_check_mark: läuft immer (Artefakt + Zusammenfassung, bei Advanced zusätzlich Code Scanning) |"
            echo "| pip-audit, actionlint, Dependency-Review | :white_check_mark: Workflow \`Security-Scan\` |"
            echo
            echo "- \`CODEQL_ADVANCED\` = \`${advanced:-<nicht gesetzt>}\`"
            echo "- Standard-Setup (Code Scanning): \`${setup_status}\`"
            if [[ "$advanced" != "true" ]]; then
              echo
              echo "> **Hinweis:** Die Inline-JavaScript-Ergebnisse erscheinen als Workflow-Artefakt, Lauf-Zusammenfassung und Annotationen. Der Upload nach *Security → Code scanning* ist erst nach Umstellung auf Advanced möglich: *Settings → Code security and analysis → Code scanning → Advanced* und Variable \`CODEQL_ADVANCED=true\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "advanced_upload_enabled=$advanced_upload_enabled" >> "$GITHUB_OUTPUT"
          echo "CODEQL_ADVANCED=${advanced:-<nicht gesetzt>}"
          echo "Default-Setup: ${setup_status}"
          echo "Advanced-Upload: ${advanced_upload_enabled}"

  analyse:
    name: CodeQL ${{ matrix.language }}
    needs: status
    if: needs.status.outputs.advanced_upload_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: CodeQL-Analyse ausführen
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  javascript:
    name: CodeQL JavaScript (Inline-Skripte)
    needs: status
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      # Das JavaScript der beiden Oberflächen steht inline in HTML-Dateien.
      # CodeQL wertet .html nicht aus, deshalb werden die Skriptblöcke vor der
      # Analyse herausgelöst - ohne sie bliebe ein großer Teil des Codes unprüft.
      - name: Inline-Skripte extrahieren
        run: python3 .github/scripts/extract-inline-js.py

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      # Advanced aktiv: Ergebnisse direkt nach Code Scanning hochladen.
      - name: CodeQL-Analyse ausführen (Code Scanning)
        if: needs.status.outputs.advanced_upload_enabled == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-inline"

      # Standard-Setup aktiv: SARIF lokal erzeugen, NICHT hochladen - GitHub
      # lehnt SARIF aus Advanced ab, solange das Standard-Setup läuft. Die
      # Ergebnisse werden stattdessen unten zusammengefasst und als Artefakt
      # bereitgestellt.
      - name: CodeQL-Analyse ausführen (Artefakt-Modus)
        if: needs.status.outputs.advanced_upload_enabled != 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-inline"
          upload: never
          output: ${{ runner.temp }}/codeql-sarif

      - name: Ergebnisse zusammenfassen
        if: needs.status.outputs.advanced_upload_enabled != 'true'
        run: python3 .github/scripts/sarif-summary.py "${{ runner.temp }}/codeql-sarif"

      - name: SARIF als Artefakt bereitstellen
        if: needs.status.outputs.advanced_upload_enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codeql-javascript-sarif
          path: ${{ runner.temp }}/codeql-sarif/
          if-no-files-found: error
